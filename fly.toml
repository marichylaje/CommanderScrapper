app = "typesense-commanderscrapper"
primary_region = "fra"

[build]
  image = "typesense/typesense:0.21.0"  # o la versión más actual

[env]
  TYPESENSE_API_KEY = "tu_api_key_segura"
  TYPESENSE_DATA_DIR = "/typesense_data"
  # CORS, TLS, etc según documentación

[http_service]
  internal_port = 8108
  force_https = true
  processes = ["app"]

[mounts]
  source = "typesense_data"
  destination = "/typesense_data"

[[vm]]
  memory = "1gb"
  cpus = 1

[processes]
  app = "/usr/bin/typesense-server --data-dir /typesense_data --api-port 8108 --listen-address 0.0.0.0"
