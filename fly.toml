app = "typesense-commanderscrapper"
primary_region = "fra"

[build]
  image = "typesense/typesense:0.21.0"

[env]
  TYPESENSE_DATA_DIR = "/data"

[http_service]
  internal_port = 8108
  force_https = true
  auto_start_machines = true
  auto_stop_machines = false
  min_machines_running = 1
  processes = ["app"]

[mounts]
  source = "typesense_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[processes]
  app = "typesense-server --data-dir /data --api-key $TYPESENSE_API_KEY --enable-cors"
