name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify offline catalog contracts
        run: npm run testOfflineDb

      - name: Check streaming all_cards projection
        run: |
          source='[{"id":"a","oracle_id":"o","games":["paper"]},{"id":"b","oracle_id":"o","games":["paper"],"card_faces":[{"image_uris":{"normal":"u"}}]},{"id":"c","games":["arena"]}]'
          filter='include "paperPrints"; fromstream(1 | truncate_stream(inputs |
            if (.[0] | type) == "string" then error(.[0]) else . end)) | paper_print'
          jq -nMc --stream --stream-errors -L scripts "$filter" <<<"$source" |
            jq -se 'map(.id) == ["a","b"] and .[1].image_uris.normal == "u"'
          if jq -nMc --stream --stream-errors -L scripts "$filter" <<<"${source%]}"; then exit 1; fi
