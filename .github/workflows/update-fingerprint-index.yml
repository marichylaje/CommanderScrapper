name: Update Fingerprint Index & Offline DB

on:
  schedule:
    # Every 2 days at 03:00 UTC
    - cron: '0 3 */2 * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild even if Scryfall has no updates'
        required: false
        default: 'false'

concurrency:
  group: fingerprint-offline-db-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-and-update:
    name: Check Scryfall freshness and rebuild if needed
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check if Scryfall has new data
        id: freshness
        run: node scripts/checkFreshness.mjs
        env:
          FINGERPRINT_INDEX_URL: ${{ secrets.FINGERPRINT_INDEX_URL }}
          FORCE_REBUILD: ${{ github.event.inputs.force }}

      - name: Preflight Scryfall metadata (default_cards)
        if: steps.freshness.outputs.needs_update == 'true'
        run: |
          node -e "(async () => { const res = await fetch('https://api.scryfall.com/bulk-data/default_cards', { headers: { 'User-Agent': 'CommanderScrapper/1.0 (CI preflight)', 'Accept': 'application/json' } }); if (!res.ok) throw new Error('Scryfall metadata HTTP ' + res.status); const meta = await res.json(); const url = meta?.jsonl_download_uri || meta?.download_uri; if (!url) throw new Error('No jsonl_download_uri/download_uri for default_cards'); console.log('Scryfall default_cards URL OK:', url); })().catch((e) => { console.error(e); process.exit(1); });"

      - name: Download Scryfall bulk data
        if: steps.freshness.outputs.needs_update == 'true'
        run: npm run scrape

      - name: Reduce to fingerprint-ready dataset
        if: steps.freshness.outputs.needs_update == 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Intento $attempt/3: npm run reduce"
            if npm run reduce; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Reintentando en 20s por fallo transitorio..."
              sleep 20
            fi
          done
          echo "Fallo definitivo en npm run reduce tras 3 intentos"
          exit 1

      - name: Upload scryfall-reduced.json to Vercel Blob
        if: steps.freshness.outputs.needs_update == 'true'
        run: node scripts/uploadScryfallReduced.mjs
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

      - name: Build offline DB (color-bucketed binary pHash DB)
        if: steps.freshness.outputs.needs_update == 'true'
        run: npm run buildOfflineDb
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Benchmark offline DB
        if: steps.freshness.outputs.needs_update == 'true'
        run: npm run benchmarkOfflineDb
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Upload offline DB to Vercel Blob
        if: steps.freshness.outputs.needs_update == 'true'
        run: npm run uploadOfflineDb
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

      - name: Build fingerprint index
        if: steps.freshness.outputs.needs_update == 'true'
        run: npm run buildIndex
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Upload fingerprint index to Vercel Blob
        if: steps.freshness.outputs.needs_update == 'true'
        run: node scripts/uploadToBlob.mjs
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

      - name: Redeploy Vercel project
        if: steps.freshness.outputs.needs_update == 'true'
        run: npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Log no-op
        if: steps.freshness.outputs.needs_update == 'false'
        run: echo "✅ Scryfall data unchanged — no rebuild needed."
