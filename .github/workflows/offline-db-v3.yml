name: Build offline paper catalog v3
on:
  workflow_dispatch:
    inputs:
      promote:
        description: Promote verified candidate to latest-v3.json
        type: boolean
        default: false

concurrency:
  group: offline-db-v3
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run testOfflineDb
      - run: bash scripts/testPreparePaperPrints.sh
      - run: bash scripts/preparePaperPrints.sh
      - name: Identify compatible hash snapshots
        id: namespace
        env:
          # Only files that influence the cached URL -> region hashes values.
          SIGNATURE: ${{ hashFiles('src/offline/phash.ts', 'src/offline/cardRegionHashes.ts', 'src/offline/contract.ts', 'package-lock.json') }}
        run: echo "prefix=offline-v3-${RUNNER_OS}-${RUNNER_ARCH}-${SIGNATURE}-" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: restore
        with:
          path: data/hashes-v3.sqlite
          # Snapshots are immutable. Prefix matching restores the newest compatible checkpoint.
          key: ${{ steps.namespace.outputs.prefix }}lookup
          # The second prefix is the previous signature (before buildOfflineDb.ts, binaryDb.ts and colorBuckets.ts were excluded); its hashes are identical.
          restore-keys: |
            ${{ steps.namespace.outputs.prefix }}
            offline-v3-Linux-X64-235f1e5e3583d1eedd7e7804c7396080490e3d3132e89fd1809362bdefffce00-
      - name: Build or checkpoint (rerun to continue)
        id: build
        run: |
          status=0
          npm run buildOfflineDb -- --source-updated "$(cat data/paper-prints.updated)" \
            --cache data/hashes-v3.sqlite --budget-minutes 90 || status=$?
          if [[ $status == 75 ]]; then
            echo "Checkpoint only; rerun workflow to continue. No publication." >> "$GITHUB_STEP_SUMMARY"
          elif [[ $status == 0 ]]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi
      - name: Identify completed SQLite snapshot
        id: snapshot
        if: ${{ !cancelled() }}
        run: |
          test -s data/hashes-v3.sqlite
          echo "digest=$(sha256sum data/hashes-v3.sqlite | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' && steps.restore.outputs.cache-matched-key != format('{0}{1}', steps.namespace.outputs.prefix, steps.snapshot.outputs.digest) }}
        with:
          path: data/hashes-v3.sqlite
          key: ${{ steps.namespace.outputs.prefix }}${{ steps.snapshot.outputs.digest }}
      - if: steps.build.outputs.complete == 'true'
        run: npm run validateOfflineDb
      - if: steps.build.outputs.complete == 'true'
        run: npm run uploadOfflineDb -- ${{ inputs.promote && '--promote-latest' || '' }}
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
