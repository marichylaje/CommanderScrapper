name: CI & Data Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 🌟 Cron 1: Los precios se actualizan DIARIAMENTE a la 1:00 AM UTC
    - cron: "0 1 * * *"
    # ⚙️ Cron 2: El pipeline completo corre cada 2 días a las 3:00 AM UTC
    - cron: "0 3 */2 * *"
  workflow_dispatch:

concurrency:
  group: commander-data-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # =========================================
  # 🌟 NUEVO JOB: Actualización diaria de precios
  # =========================================
# =========================================
  # 🌟 NUEVO JOB: Actualización diaria de precios
  # =========================================
  daily-prices:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 1 * * *')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          # 1. Traemos todo el historial y permitimos persistir las credenciales para el pull
          fetch-depth: 0 
          persist-credentials: true

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Instalar dependencias
        run: npm ci

      - name: Preflight Scryfall metadata (oracle_cards)
        run: |
          node -e "(async () => { const res = await fetch('https://api.scryfall.com/bulk-data', { headers: { 'User-Agent': 'CommanderScrapper/1.0 (CI preflight)', 'Accept': 'application/json' } }); if (!res.ok) throw new Error('Scryfall metadata HTTP ' + res.status); const body = await res.json(); const oracle = (body.data || []).find((x) => x.type === 'oracle_cards'); const url = oracle?.jsonl_download_uri || oracle?.download_uri; if (!url) throw new Error('No jsonl_download_uri/download_uri for oracle_cards'); console.log('Scryfall oracle_cards URL OK:', url); })().catch((e) => { console.error(e); process.exit(1); });"

      - name: Ejecutar actualización de precios de Scryfall
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Intento $attempt/3: npm run prices"
            if npm run prices; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Reintentando en 15s por fallo transitorio..."
              sleep 15
            fi
          done
          echo "Fallo definitivo en npm run prices tras 3 intentos"
          exit 1

      - name: Auto-commit solo del archivo de precios
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore(prices): update daily scryfall card prices"
          branch: main
          commit_user_name: "commander-bot"
          commit_user_email: "commander-bot@users.noreply.github.com"
          file_pattern: "data/reduced-prices.json"
          # 2. 🌟 ESTA ES LA CLAVE: Si hay commits nuevos en remoto, los integra primero en el historial
          push_options: '--force-with-lease'

  # =========================================
  #  Job 1: CI (build del repo)
  # =========================================
  ci:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Instalar dependencias
        run: npm ci

      - name: Build (TypeScript)
        run: npm run build

  # =========================================
  #  Job 2: Data pipeline + Typesense + Fly
  # =========================================
  data-pipeline:
    # Solo corre de forma manual o en el Cron 2 (cada 2 días)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 3 */2 * *')
    runs-on: ubuntu-latest

    env:
      TYPESENSE_API_KEY: ${{ secrets.TYPESENSE_API_KEY }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Instalar dependencias
        run: npm ci

      - name: confirmar qué index.ts se está ejecutando
        run: |
          node -v
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "Mostrando src/index.ts (primeras 30 líneas):"
          sed -n '1,30p' src/index.ts

      # -------------------------
      # Fase A: Fetch + reducir
      # -------------------------
      - name: 1) Descargar datos de Scryfall (scrape)
        run: npm run scrape

      - name: 2) Reducir datos (reduce)
        run: npm run reduce

      - name: 3) Añadir precios (prices)
        run: npm run prices

      # ------------------------------------
      # Fase B: Precons (commander + influencers)
      # ------------------------------------
      - name: 4) Dividir precons de commanders
        run: npm run splitCommander

      - name: 5) Dividir precons de influencers
        run: npm run splitInfluencer

      # -----------------------------
      # Fase C: Typesense + Fly.io
      # -----------------------------
      - name: 6) Borrar colección antigua en Typesense (opcional)
        run: npm run deleteCollection

      - name: 7) Crear schema en Typesense
        run: npm run typeSchema

      - name: 8) Importar datos a Typesense
        run: npm run importCollection

      - name: 9) Reiniciar app en Fly.io
        run: npm run restartFly

      # -----------------------------
      # Limpieza de archivo gigante
      # -----------------------------
      - name: 10) Eliminar commander_precons.json (no commitear archivo grande)
        if: always()
        run: |
          echo "Eliminando data/commander_precons.json para evitar que acabe en el repo..."
          rm -f data/commander_precons.json

      # -----------------------------
      # Auto-commit de datos generados
      # -----------------------------
      - name: 11) Auto-commit de archivos de datos
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: update commander data"
          branch: main
          commit_user_name: "commander-bot"
          commit_user_email: "commander-bot@users.noreply.github.com"
          file_pattern: "data/**/*.json"
